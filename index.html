    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

         resolve relative ones. The card is public/og.png, rendered from
         docs/brand/og-card.html. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RPG Build Optimizer" />
    <meta property="og:title" content="RPG Build Optimizer" />

      property="og:description"
      content="Exact branch-and-bound gear build optimizer for gacha RPGs — computed entirely in your browser."
    />

      property="og:image"
      content="https://rpg-build-optimizer.vercel.app/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="RPG Build Optimizer: exact search, proven optimal."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RPG Build Optimizer" />

      name="twitter:description"

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

         so the above-the-fold heading doesn't wait on the stylesheet round
         trip before the browser discovers it needs this file. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="https://fonts.gstatic.com/s/spacegrotesk/v22/V8mDoQDjQSkFtoMM3T6r8E7mPbF4Cw.woff2"

    />

      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Spline+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"

    />
